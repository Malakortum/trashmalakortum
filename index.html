<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>มอนสเตอร์หิวขยะ</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@600;800&family=Pixelify+Sans:wght@700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05071a;font-family:"Pixelify Sans","Kanit",Tahoma,sans-serif;color:#fff}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px);z-index:5}
  video{display:none}
  .card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;width:min(900px,90vw);max-height:92vh;overflow:auto;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:26px;background:#1a1340;color:#fff;border:6px solid #fff;outline:6px solid #000;box-shadow:16px 16px 0 #000}
  .card h1{margin:0;line-height:0}
  .card h1 canvas{position:static;width:auto;height:auto}
  .card p{font-size:clamp(17px,2vw,24px);margin:0;line-height:1.45}
  .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
  button{font:inherit;font-family:"Kanit",Tahoma,sans-serif;font-size:clamp(18px,2.1vw,26px);padding:10px 24px;border:4px solid #000;border-radius:0;cursor:pointer;background:#ffcf33;color:#000;font-weight:800;box-shadow:inset -5px -5px 0 rgba(0,0,0,.3),inset 5px 5px 0 rgba(255,255,255,.5),6px 6px 0 #000}
  button:active{transform:translate(4px,4px);box-shadow:inset 5px 5px 0 rgba(0,0,0,.3),2px 2px 0 #000}
  button.blue{background:#4fd7ff} button.pink{background:#ff5fa2}
  button.tog{font-size:clamp(15px,1.6vw,20px);padding:8px 16px;background:#c9c3e6;box-shadow:inset -4px -4px 0 rgba(0,0,0,.3),4px 4px 0 #000}
  button.tog.on{background:#7be39a}
  .card p,.label,.lbtitle,table{font-family:"Kanit",Tahoma,sans-serif}
  button.small{font-size:18px;padding:8px 18px}
  .label{font-weight:700;font-size:18px}
  input{font:inherit;font-size:24px;padding:10px 14px;border:4px solid #000;border-radius:0;width:min(320px,60vw);background:#fff;color:#000;font-family:"Kanit",Tahoma,sans-serif}
  table{border-collapse:collapse;font-size:clamp(15px,1.6vw,20px);min-width:min(460px,80vw)}
  th,td{padding:4px 12px;border-bottom:2px dashed #5a4f9a}
  th{border-bottom:4px solid #fff;color:#ffcf33}
  tr.me td{background:#ffcf33;color:#000;font-weight:800}
  .lbtitle{font-weight:700;font-size:20px;margin-top:4px}
  .hidden{display:none!important}
  .legend span{font-family:Kanit,Tahoma,sans-serif;font-weight:800;padding:6px 14px;border:4px solid #000;color:#fff;font-size:clamp(15px,1.7vw,20px)}
  #status{font-size:16px;color:#a9a2d6;font-family:"Kanit",Tahoma,sans-serif}
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="c"></canvas>
<canvas id="u"></canvas>

<div id="start" class="card">
  <h1>มอนสเตอร์หิวขยะ!</h1>
  <p><b>โบกมือ</b> ไปแตะขยะเพื่อหยิบ แล้วป้อนให้มอนสเตอร์ให้ถูกตัว<br>ป้อนผิด มอนสเตอร์จะคายออกมา!</p>
  <div class="row legend">
    <span style="background:#3fbf5a">ขยะเปียก</span><span style="background:#ffcf33;color:#000">รีไซเคิล</span>
    <span style="background:#3f8fff">ขยะทั่วไป</span><span style="background:#ff4f4f">ขยะอันตราย</span>
  </div>
  <div class="row">
    <button class="blue" onclick="startGame('solo')">เล่นคนเดียว</button>
    <button class="pink" onclick="startGame('duo')">แข่ง 2 คน</button>
  </div>
  <div id="status">กำลังเปิดกล้อง...</div>
</div>

<div id="end" class="card hidden">
  <h1 id="endTitle"></h1>
  <p id="endText"></p>
  <div class="row"><button class="blue" onclick="showStart()">กลับเมนู</button></div>
</div>

<script type="module">
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const ucanvas = document.getElementById('u'), U = ucanvas.getContext('2d');
const PX = 4, PXU = 2;
const INK = '#000', PAPER = '#1a1340', THAI = 'Kanit,Tahoma,sans-serif';
const P_COLORS = ['#ff5fa2', '#3fb6ff'], P_NAMES = ['ฝั่งซ้าย', 'ฝั่งขวา'];
const GAME_TIME = 60;
let W, H;

const MONSTERS = {
  green:  {name:'ขยะเปียก',   body:'#3fbf5a', dark:'#23803a', lid:'#1d6b30'},
  yellow: {name:'รีไซเคิล',   body:'#ffcf33', dark:'#c99a10', lid:'#a87d00'},
  blue:   {name:'ขยะทั่วไป', body:'#3f8fff', dark:'#2560c0', lid:'#1c4a96'},
  red:    {name:'ขยะอันตราย', body:'#ff4f4f', dark:'#c02e2e', lid:'#962020'},
};
const ITEMS = [
  {e:'🍌',n:'เปลือกกล้วย',b:'green',f:'เศษอาหารหมักเป็นปุ๋ยให้ต้นไม้ได้'},
  {e:'🍎',n:'แกนแอปเปิล',b:'green',f:'ขยะเปียกย่อยสลายได้เองตามธรรมชาติ'},
  {e:'🥚',n:'เปลือกไข่',b:'green',f:'เปลือกไข่บดเป็นปุ๋ยให้ต้นไม้ได้'},
  {e:'🍂',n:'ใบไม้แห้ง',b:'green',f:'ใบไม้แห้งทำปุ๋ยหมักได้ดีมาก'},
  {e:'🐟',n:'ก้างปลา',b:'green',f:'เศษอาหารควรแยกออก ไม่ให้ปนกับขยะอื่น'},
  {e:'🍉',n:'เปลือกแตงโม',b:'green',f:'เปลือกผลไม้เป็นอาหารของไส้เดือนได้'},
  {e:'🧴',n:'ขวดพลาสติก',b:'yellow',f:'ขวดพลาสติกรีไซเคิลเป็นเสื้อได้นะ'},
  {e:'🥫',n:'กระป๋อง',b:'yellow',f:'กระป๋องอะลูมิเนียมรีไซเคิลได้แทบไม่จำกัดครั้ง'},
  {e:'📰',n:'หนังสือพิมพ์',b:'yellow',f:'รีไซเคิลกระดาษช่วยลดการตัดต้นไม้'},
  {e:'📦',n:'กล่องกระดาษ',b:'yellow',f:'กล่องกระดาษนำกลับมาทำกล่องใหม่ได้'},
  {e:'🍾',n:'ขวดแก้ว',b:'yellow',f:'แก้วหลอมแล้วทำขวดใหม่ได้เรื่อย ๆ'},
  {e:'🍬',n:'ซองขนม',b:'blue',f:'ซองขนมมีหลายชั้นซ้อนกัน เลยรีไซเคิลยาก'},
  {e:'🧻',n:'ทิชชู่ใช้แล้ว',b:'blue',f:'ทิชชู่ใช้แล้วสกปรก รีไซเคิลไม่ได้'},
  {e:'🍱',n:'กล่องโฟม',b:'blue',f:'โฟมใช้เวลาย่อยสลายนานหลายร้อยปี'},
  {e:'🩹',n:'พลาสเตอร์ยา',b:'blue',f:'ของใช้แล้วที่ปนเปื้อน ทิ้งถังทั่วไป'},
  {e:'🔋',n:'ถ่านไฟฉาย',b:'red',f:'ถ่านมีสารเคมีอันตรายต่อดินและน้ำ'},
  {e:'💡',n:'หลอดไฟ',b:'red',f:'หลอดไฟบางชนิดมีสารปรอทอยู่ข้างใน'},
  {e:'💊',n:'ยาหมดอายุ',b:'red',f:'ยาหมดอายุห้ามทิ้งรวมกับขยะทั่วไป'},
  {e:'📱',n:'มือถือเก่า',b:'red',f:'ขยะอิเล็กทรอนิกส์มีโลหะหนัก ต้องแยกทิ้ง'},
  {e:'🌡️',n:'ปรอทวัดไข้',b:'red',f:'ปรอทเป็นพิษ ถ้าแตกห้ามจับด้วยมือ'},
  // เพิ่ม
  {e:'🍚',n:'ข้าวเหลือ',b:'green',f:'กินข้าวให้หมดจาน ช่วยลดขยะเปียกได้'},
  {e:'🥕',n:'เศษผัก',b:'green',f:'เศษผักทำปุ๋ยหมักหรือน้ำหมักชีวภาพได้'},
  {e:'☕',n:'กากกาแฟ',b:'green',f:'กากกาแฟโรยดินช่วยบำรุงต้นไม้ได้'},
  {e:'🥥',n:'กะลามะพร้าว',b:'green',f:'กะลามะพร้าวย่อยสลายได้ตามธรรมชาติ'},
  {e:'🍗',n:'กระดูกไก่',b:'green',f:'เศษอาหารทุกชนิดเป็นขยะเปียก'},
  {e:'🥛',n:'กล่องนม',b:'yellow',f:'กล่องนมรีไซเคิลทำเป็นแผ่นหลังคาได้'},
  {e:'📄',n:'กระดาษ A4',b:'yellow',f:'กระดาษใช้สองหน้าก่อนทิ้ง ช่วยประหยัดต้นไม้'},
  {e:'🥤',n:'แก้วพลาสติก',b:'yellow',f:'ล้างแก้วก่อนทิ้ง จะรีไซเคิลได้ง่ายขึ้น'},
  {e:'🔩',n:'เศษเหล็ก',b:'yellow',f:'เหล็กหลอมแล้วนำมาใช้ใหม่ได้'},
  {e:'🍥',n:'ซองบะหมี่',b:'blue',f:'ซองบะหมี่เปื้อนน้ำมัน รีไซเคิลยาก'},
  {e:'🥢',n:'ตะเกียบใช้แล้ว',b:'blue',f:'ของใช้แล้วที่เปื้อนอาหาร ทิ้งถังทั่วไป'},
  {e:'😷',n:'หน้ากากอนามัย',b:'blue',f:'หน้ากากใช้แล้ว พับใส่ถุงก่อนทิ้งนะ'},
  {e:'🧸',n:'ตุ๊กตาขาด',b:'blue',f:'ของเล่นที่ยังดีอยู่ บริจาคต่อได้นะ'},
  {e:'🥡',n:'กล่องข้าวเปื้อน',b:'blue',f:'กล่องที่เปื้อนอาหารมาก รีไซเคิลไม่ได้'},
  {e:'🧯',n:'กระป๋องสเปรย์',b:'red',f:'กระป๋องสเปรย์มีแรงดัน ห้ามเผาเด็ดขาด'},
  {e:'🎨',n:'กระป๋องสี',b:'red',f:'สีมีสารเคมี ต้องแยกทิ้งเป็นขยะอันตราย'},
  {e:'🧪',n:'น้ำยาเคมี',b:'red',f:'น้ำยาเคมีห้ามเทลงท่อ เป็นอันตรายต่อสัตว์น้ำ'},
  {e:'🔌',n:'สายชาร์จเสีย',b:'red',f:'เครื่องใช้ไฟฟ้าเสียเป็นขยะอันตราย'},
];

let mode = 'solo', level = 1, state = 'menu', players = [], countdown = 0, lastT = 0, playT = 0, lastBeep = 4;
let particles = [], stars = [], banner = null, keys = [];
for (let i=0;i<90;i++) stars.push({x:Math.random(), y:Math.random(), s:Math.random()*2+0.5, p:Math.random()*6});

function resize(){
  W = innerWidth; H = innerHeight;
  canvas.width = Math.ceil(W/PX); canvas.height = Math.ceil(H/PX);
  ucanvas.width = Math.ceil(W/PXU); ucanvas.height = Math.ceil(H/PXU);
  ctx.setTransform(1/PX,0,0,1/PX,0,0); U.setTransform(1/PXU,0,0,1/PXU,0,0);
  ctx.imageSmoothingEnabled = false; U.imageSmoothingEnabled = false;
  players.forEach(layoutPlayer);
}
addEventListener('resize', resize);

// ---------- sound ----------
let actx = null;
function audio(){ if (!actx) try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch {} return actx; }
function tone(f, d=0.15, type='square', vol=0.1, delay=0, f2=null){
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t+d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + 0.05);
}
const sfx = {
  grab:  ()=> tone(440, 0.07, 'triangle', 0.12),
  chomp: ()=>{ for (let i=0;i<3;i++) tone(180-i*20, 0.07, 'square', 0.12, i*0.11); tone(880,0.12,'square',0.08,0.36); tone(1320,0.18,'square',0.08,0.45); },
  yuck:  ()=> tone(400, 0.45, 'sawtooth', 0.09, 0, 90),
  combo: n => [660,880,1100,1320].slice(0, Math.min(4, n)).forEach((f,i)=>tone(f,0.1,'square',0.08,0.5+i*0.07)),
  beep:  ()=> tone(520, 0.15, 'square', 0.1),
  go:    ()=> tone(880, 0.35, 'square', 0.12),
  win:   ()=> [523,659,784,1046,1318].forEach((f,i)=>tone(f,0.25,'square',0.1,i*0.12)),
};

// ---------- menu ----------
window.setLevel = lv => {
  level = lv;
  document.getElementById('lv1').classList.toggle('on', lv===1);
  document.getElementById('lv2').classList.toggle('on', lv===2);
};
window.showStart = ()=>{
  state = 'menu'; players = [];
  document.getElementById('end').classList.add('hidden');
  document.getElementById('start').classList.remove('hidden');
};
window.startGame = m => {
  audio(); mode = m;
  keys = ['green','yellow','blue','red'];
  const pool = ITEMS.filter(i => keys.includes(i.b));
  // สุ่มแบบวนครบทุกชิ้นก่อนซ้ำ และสลับประเภทให้ทั่วถึง
  const order = []; while (order.length < 120) order.push(...[...pool].sort(()=>Math.random()-0.5));
  players = mode==='solo' ? [makePlayer(0,0,1,order)] : [makePlayer(0,0,0.5,order), makePlayer(1,0.5,1,order)];
  players.forEach(layoutPlayer);
  particles = []; banner = null; state = 'countdown'; countdown = 3.999; lastBeep = 4;
  document.getElementById('start').classList.add('hidden');
  document.getElementById('end').classList.add('hidden');
};
addEventListener('keydown', e=>{
  if (e.code === 'Space' && state === 'over') showStart();
  if (e.code === 'Escape') showStart();
});

// ---------- players ----------
function makePlayer(idx, f0, f1, order){
  return {idx, f0, f1, order, k:0, current:null, held:false, score:0, wrong:0, combo:0, best:0,
          hand:{x:-999,y:-999,seen:false}, pts:null, lost:0, msg:null, mons:[], R:40};
}
function layoutPlayer(p){
  p.x0 = p.f0*W; p.x1 = p.f1*W;
  const w = p.x1-p.x0, n = keys.length, slot = w/n;
  const mw = Math.min(slot*0.72, 240), mh = Math.min(H*0.3, mw*1.15);
  p.R = Math.min(w*0.07, H*0.075);
  const old = p.mons;
  p.mons = keys.map((k,i)=>({k, ...MONSTERS[k], x: p.x0 + slot*(i+0.5) - mw/2, y: H - mh - 22, w: mw, h: mh,
    open: 0, chomp: 0, happy: 0, yuck: 0, shake: 0, ph: Math.random()*6, ...(old[i] ? {open:old[i].open} : {})}));
}
function nextItem(p){
  const it = p.order[p.k++ % p.order.length], w = p.x1-p.x0;
  p.current = {...it, x: p.x0 + w*(0.25+Math.random()*0.5), y: -60, wob: 0, bounce: 0, spitVX: 0, spitVY: 0};
}
function updatePlayer(p, dt){
  for (const m of p.mons){ m.chomp = Math.max(0,m.chomp-dt); m.happy = Math.max(0,m.happy-dt); m.yuck = Math.max(0,m.yuck-dt); m.shake = Math.max(0,m.shake-dt*2); }
  const c = p.current; if (!c) return;
  const h = p.hand;
  if (c.bounce > 0){ // ถูกคายออกมา
    c.bounce -= dt; c.x += c.spitVX*dt; c.y += c.spitVY*dt; c.spitVY += 900*dt;
    c.x = Math.max(p.x0+p.R, Math.min(p.x1-p.R, c.x));
    if (c.bounce <= 0) c.y = Math.min(c.y, H*0.35);
  } else if (!h.seen){ p.lost += dt; if (p.held && p.lost > 0.6) p.held = false; }
  else {
    p.lost = 0;
    if (!p.held && Math.hypot(c.x-h.x, c.y-h.y) < p.R*1.5){ p.held = true; sfx.grab(); }
    if (p.held){
      c.x += (h.x-c.x)*0.5; c.y += (h.y-c.y)*0.5;
      c.x = Math.max(p.x0+p.R, Math.min(p.x1-p.R, c.x));
      const m = p.mons.find(m => c.x > m.x-10 && c.x < m.x+m.w+10 && c.y > m.y+m.h*0.05);
      if (m) feed(p, m);
    }
  }
  if (!p.held && c.bounce <= 0){
    c.wob += dt*2;
    const stopY = H*0.33;
    if (c.y < stopY) c.y = Math.min(stopY, c.y + H*0.3*dt); else c.y = stopY + Math.sin(c.wob)*12;
  }
  // ปากอ้าตามระยะขยะที่ถืออยู่
  for (const m of p.mons){
    const near = p.held ? Math.max(0, 1 - Math.hypot(c.x-(m.x+m.w/2), c.y-(m.y+m.h*0.45)) / (m.w*1.6)) : 0;
    m.open += (near - m.open)*Math.min(1, dt*10);
  }
}
function feed(p, m){
  const c = p.current; p.held = false;
  if (m.k === c.b){
    p.score++; p.combo++; p.best = Math.max(p.best, p.combo);
    m.chomp = 0.55; m.happy = 1.1; sfx.chomp();
    if (p.combo >= 3) sfx.combo(p.combo - 1);
    crumbs(m.x+m.w/2, m.y+m.h*0.4, [m.body,'#fff','#ffcf33']);
    p.msg = {ok:true, title: p.combo >= 3 ? `อร่อย! คอมโบ x${p.combo}` : `อร่อย! ${c.n} → ${m.name}`, text: c.f, t: mode==='solo'?3:1.6};
    nextItem(p);
  } else {
    p.wrong++; p.combo = 0; m.yuck = 1; m.shake = 1; sfx.yuck();
    p.msg = {ok:false, title:`แหวะ! ${c.n} ไม่ใช่${m.name}`, text: true ? `ต้องป้อนให้ตัว "${MONSTERS[c.b].name}" นะ` : '', t:2.4};
    c.bounce = 0.7; c.spitVX = (Math.random()-0.5)*500; c.spitVY = -900;
  }
}
function crumbs(x, y, colors){
  for (let i=0;i<26;i++){ const a=Math.random()*Math.PI*2, v=150+Math.random()*320;
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-200,c:colors[i%colors.length],life:1}); }
}
function confetti(x0, x1){
  const cols = ['#ff5fa2','#3fb6ff','#ffcf33','#7be39a','#ffffff','#b48cff'];
  for (let i=0;i<220;i++) particles.push({x:x0+Math.random()*(x1-x0), y:-20-Math.random()*H*0.5, vx:(Math.random()-0.5)*120, vy:100+Math.random()*200, c:cols[i%cols.length], life:3.5, slow:true});
}

// ---------- end ----------
function endGame(){
  state = 'over'; sfx.win();
  if (mode === 'solo'){
    const p = players[0]; confetti(0, W);
    const title = p.score >= 15 ? 'ฮีโร่รักษ์โลกระดับตำนาน!' : p.score >= 10 ? 'ฮีโร่รักษ์โลกระดับทอง!' : p.score >= 5 ? 'ฮีโร่รักษ์โลกระดับเงิน!' : 'ฮีโร่รักษ์โลกฝึกหัด!';
    setTimeout(()=>{
      pixelTitle(document.getElementById('endTitle'), title);
      document.getElementById('endText').innerHTML = `ป้อนถูก <b>${p.score}</b> ชิ้น · ป้อนผิด ${p.wrong} ชิ้น · คอมโบสูงสุด x${p.best}<br><br><span style="font-size:.85em">กลับบ้านไปช่วยที่บ้านแยกขยะด้วยนะ มอนสเตอร์ฝากมา</span>`;
      document.getElementById('end').classList.remove('hidden');
    }, 1300);
    return;
  }
  const [a, b] = players;
  const w = a.score > b.score ? a : b.score > a.score ? b : (a.wrong < b.wrong ? a : b.wrong < a.wrong ? b : null);
  if (w){ confetti(w.x0, w.x1); banner = {p: w}; } else confetti(0, W);
  setTimeout(()=>{
    pixelTitle(document.getElementById('endTitle'), w ? `${P_NAMES[w.idx]}ชนะ!` : 'เสมอกัน! เก่งทั้งคู่', w ? P_COLORS[w.idx] : '#ffcf33');
    const line = p => `<b style="color:${P_COLORS[p.idx]}">${P_NAMES[p.idx]}</b> ป้อนถูก ${p.score} ชิ้น · ผิด ${p.wrong} · คอมโบสูงสุด x${p.best}`;
    document.getElementById('endText').innerHTML = `${line(a)}<br>${line(b)}`;
    document.getElementById('end').classList.remove('hidden');
  }, 2200);
}

// ---------- hand tracking ----------
let handOK = false, landmarker = null, lastVideoTime = -1;
addEventListener('mousemove', e=>{
  if (handOK || !players.length) return;
  const p = players.find(p => e.clientX >= p.x0 && e.clientX < p.x1) || players[0];
  players.forEach(q => { if (q !== p) q.hand.seen = false; });
  p.hand.x = e.clientX; p.hand.y = e.clientY; p.hand.seen = true;
});
async function initHands(){
  try{
    video.srcObject = await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720,facingMode:'user'}});
    await video.play();
    statusEl.textContent = 'เปิดกล้องแล้ว กำลังโหลดตัวจับมือ...';
    const {FilesetResolver, HandLandmarker} = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const fs = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const opts = d => ({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate:d}, runningMode:'VIDEO', numHands:2});
    try { landmarker = await HandLandmarker.createFromOptions(fs, opts('GPU')); }
    catch { landmarker = await HandLandmarker.createFromOptions(fs, opts('CPU')); }
    handOK = true;
    statusEl.textContent = 'พร้อมเล่น! ยืนห่างกล้องประมาณ 1–1.5 เมตร แล้วยกมือขึ้น';
  }catch(err){
    console.error(err);
    statusEl.textContent = 'เปิดกล้องหรือตัวจับมือไม่ได้ ตอนนี้เล่นด้วยเมาส์ได้ · ตรวจว่าอนุญาตกล้องและต่ออินเทอร์เน็ต';
  }
}
const video = document.getElementById('video'), statusEl = document.getElementById('status');
const mapPt = p => ({x:(1-(0.5+(p.x-0.5)*1.4))*W, y:(0.5+(p.y-0.5)*1.4)*H});
function trackHands(){
  if (!handOK || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const r = landmarker.detectForVideo(video, performance.now());
  const found = (r.landmarks || []).map(L => ({pts: L.map(mapPt), c: mapPt({x:(L[0].x+L[9].x)/2, y:(L[0].y+L[9].y)/2})}));
  const assigned = players.map(()=>null);
  if (mode === 'solo'){ if (found[0]) assigned[0] = found[0]; }
  else for (const f of found){ const side = f.c.x < W/2 ? 0 : 1; if (!assigned[side]) assigned[side] = f; }
  players.forEach((p,i)=>{
    const f = assigned[i];
    if (!f){ p.hand.seen = false; p.pts = null; return; }
    p.pts = f.pts;
    p.hand.x = p.hand.seen ? p.hand.x + (f.c.x-p.hand.x)*0.55 : f.c.x;
    p.hand.y = p.hand.seen ? p.hand.y + (f.c.y-p.hand.y)*0.55 : f.c.y;
    p.hand.seen = true;
  });
}

// ---------- drawing helpers ----------
function sticker(x,y,w,h,fill,sh=6){
  const ctx = U;
  ctx.fillStyle='#000'; ctx.fillRect(x-4+sh,y-4+sh,w+8,h+8);
  ctx.fillStyle='#000'; ctx.fillRect(x-8,y-8,w+16,h+16);
  ctx.fillStyle='#fff'; ctx.fillRect(x-4,y-4,w+8,h+8);
  ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);
}
function label(t, x, y, size, fill='#fff'){
  const ctx = U;
  ctx.font = `800 ${size}px ${/^[0-9A-Za-z!?\sx/.]+$/.test(t) ? '"Press Start 2P",' : ''}${THAI}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'miter';
  ctx.lineWidth = Math.max(6, size*0.28); ctx.strokeStyle = INK; ctx.strokeText(t, x, y);
  ctx.fillStyle = fill; ctx.fillText(t, x, y);
}
function drawBG(t){
  if (handOK && video.videoWidth){
    const vw=video.videoWidth, vh=video.videoHeight, s=Math.max(W/vw,H/vh);
    ctx.save(); ctx.translate(W,0); ctx.scale(-1,1);
    ctx.drawImage(video,(W-vw*s)/2,(H-vh*s)/2,vw*s,vh*s); ctx.restore();
  } else {
    ctx.fillStyle='#4fc3f7'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#8fd96a'; ctx.fillRect(0,H*0.72,W,H*0.28);
    ctx.fillStyle='#fff'; for (const s of stars.slice(0,8)){ const cx=((s.x*W + t*0.02*s.s) % (W+200))-100, cy=s.y*H*0.4; ctx.fillRect(cx,cy,80,24); ctx.fillRect(cx+16,cy-16,48,16); }
  }
}

// ---------- monster ----------
function drawMonster(m, p, t){
  const bob = Math.round(Math.sin(t/400 + m.ph)*1.5)*4;
  const sx = m.shake > 0 ? Math.round(Math.sin(t/30)*3)*4*m.shake : 0;
  const x = m.x + sx, y = m.y + bob, w = m.w, h = m.h;
  const chompOpen = m.chomp > 0 ? Math.abs(Math.sin(m.chomp*17)) : 0;
  const open = Math.max(m.open, chompOpen, m.yuck > 0.5 ? 0.8 : 0);
  // ตัว (ถัง) ขอบดำ
  ctx.fillStyle = INK; ctx.fillRect(x-8, y+h*0.14-8, w+16, h*0.86+16);
  ctx.fillStyle = m.body; ctx.fillRect(x, y+h*0.14, w, h*0.86);
  ctx.fillStyle = m.dark; ctx.fillRect(x, y+h*0.86, w, h*0.14);
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(x+12, y+h*0.2, 12, h*0.5);
  // ฝา = ผม ยกขึ้นตอนอ้าปาก
  const lidY = y - open*h*0.12;
  ctx.fillStyle = INK; ctx.fillRect(x-20, lidY-8, w+40, h*0.14+16);
  ctx.fillStyle = m.lid; ctx.fillRect(x-12, lidY, w+24, h*0.14);
  ctx.fillStyle = INK; ctx.fillRect(x+w/2-20, lidY-h*0.08, 40, h*0.08);
  // ตา มองตามขยะ
  const c = p.current, tx = c ? c.x : x+w/2, ty = c ? c.y : y;
  const ex = w*0.2, ey = y + h*0.32, es = w*0.2;
  for (const side of [-1, 1]){
    const cx = x + w/2 + side*ex;
    if (m.happy > 0){ // ตายิ้ม ^ ^
      ctx.fillStyle = INK;
      ctx.fillRect(cx-es/2, ey, es*0.3, 8); ctx.fillRect(cx-es*0.2, ey-10, es*0.4, 8); ctx.fillRect(cx+es*0.2, ey, es*0.3, 8);
    } else if (m.yuck > 0){ // ตา X
      ctx.fillStyle = INK;
      for (let k=-2;k<=2;k++){ ctx.fillRect(cx+k*es*0.12-4, ey+k*es*0.12-4, 8, 8); ctx.fillRect(cx+k*es*0.12-4, ey-k*es*0.12-4, 8, 8); }
    } else {
      ctx.fillStyle = INK; ctx.fillRect(cx-es/2-6, ey-es/2-6, es+12, es+12);
      ctx.fillStyle = '#fff'; ctx.fillRect(cx-es/2, ey-es/2, es, es);
      const a = Math.atan2(ty-ey, tx-cx), d = es*0.22;
      ctx.fillStyle = INK; ctx.fillRect(cx + Math.cos(a)*d - es*0.2, ey + Math.sin(a)*d - es*0.2, es*0.4, es*0.4);
    }
  }
  // ปาก
  const mw = w*0.62, mh = h*0.06 + open*h*0.26, mx = x + (w-mw)/2, my = y + h*0.5;
  ctx.fillStyle = INK; ctx.fillRect(mx, my, mw, mh);
  if (mh > h*0.12){ ctx.fillStyle = '#ff6b8a'; ctx.fillRect(mx+mw*0.25, my+mh-h*0.06, mw*0.5, h*0.05); }
  ctx.fillStyle = '#fff';
  const teeth = 4, tw = mw/(teeth*2);
  for (let i=0;i<teeth;i++) ctx.fillRect(mx + tw*(i*2+0.5), my, tw, Math.min(12, mh*0.4));
  if (m.yuck > 0){ // ลิ้นแลบ
    ctx.fillStyle = '#ff6b8a'; ctx.fillRect(mx+mw*0.35, my+mh-6, mw*0.3, h*0.1);
  }
}
function drawMonsterLabels(p){
  const fs = Math.max(15, Math.min((p.x1-p.x0)/keys.length*0.11, 26));
  for (const m of p.mons){
    label(m.name, m.x+m.w/2, m.y+m.h*0.93, fs);
    if (m.yuck > 0.2) bubble(m.x+m.w/2, m.y-m.h*0.22, 'แหวะ!', '#ff6b5e');
    else if (m.happy > 0.2) bubble(m.x+m.w/2, m.y-m.h*0.22, 'งั่ม ๆ!', '#7be39a');
  }
}
function bubble(x, y, t, col){
  const ctx = U, f = Math.max(18, Math.min(W,H)*0.035);
  ctx.font = `800 ${f}px ${THAI}`;
  const w = ctx.measureText(t).width + 28;
  sticker(x-w/2, y-f*0.8, w, f*1.6, '#fff', 4);
  ctx.fillStyle = col; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(t, x, y);
}
function drawItem(p){
  const c = p.current; if (!c) return;
  const r = p.R*(p.held?1.12:1), x = c.x, y = c.y;
  if (!p.held && c.bounce <= 0){ ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=8; ctx.setLineDash([12,10]);
    ctx.strokeRect(x-r*1.25, y-r*1.25, r*2.5, r*2.5); ctx.setLineDash([]); }
  ctx.fillStyle = INK; ctx.fillRect(x-r-8, y-r-8, r*2+16, r*2+16);
  ctx.fillStyle = '#fff8e7'; ctx.fillRect(x-r, y-r, r*2, r*2);
  ctx.font = `${r*1.45}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(c.e, x, y + r*0.08);
}
function drawItemLabel(p){
  const c = p.current; if (!c) return;
  const r = p.R*(p.held?1.12:1);
  label(c.n, c.x, c.y - r - Math.max(18, r*0.45), Math.max(18, r*0.45));
}
const BONES=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawHand(p){
  if (!p.hand.seen) return;
  const col = mode==='duo' ? P_COLORS[p.idx] : '#8fe9ff';
  if (p.pts){
    ctx.lineCap='square';
    ctx.strokeStyle=INK; ctx.lineWidth=12; for (const [a,b] of BONES){ ctx.beginPath(); ctx.moveTo(p.pts[a].x,p.pts[a].y); ctx.lineTo(p.pts[b].x,p.pts[b].y); ctx.stroke(); }
    ctx.strokeStyle=col; ctx.lineWidth=6; for (const [a,b] of BONES){ ctx.beginPath(); ctx.moveTo(p.pts[a].x,p.pts[a].y); ctx.lineTo(p.pts[b].x,p.pts[b].y); ctx.stroke(); }
    ctx.fillStyle='#fff'; for (const q of p.pts) ctx.fillRect(q.x-5,q.y-5,10,10);
  }
  const r = Math.min(W,H)*0.045;
  ctx.fillStyle=INK; ctx.fillRect(p.hand.x-r-6, p.hand.y-r-6, r*2+12, 14); ctx.fillRect(p.hand.x-r-6, p.hand.y+r-8, r*2+12, 14);
  ctx.fillRect(p.hand.x-r-6, p.hand.y-r-6, 14, r*2+12); ctx.fillRect(p.hand.x+r-8, p.hand.y-r-6, 14, r*2+12);
  ctx.fillStyle = p.held ? '#ffcf33' : col;
  ctx.fillRect(p.hand.x-r-2, p.hand.y-r-2, r*2+4, 6); ctx.fillRect(p.hand.x-r-2, p.hand.y+r-4, r*2+4, 6);
  ctx.fillRect(p.hand.x-r-2, p.hand.y-r-2, 6, r*2+4); ctx.fillRect(p.hand.x+r-4, p.hand.y-r-2, 6, r*2+4);
}
function drawHUD(p){
  const ctx = U, f = Math.max(18, Math.min(W,H)*0.04);
  ctx.font = `800 ${f}px ${THAI}`; ctx.textBaseline='middle'; ctx.textAlign='left';
  const remain = Math.max(0, GAME_TIME - playT);
  const txt = mode==='solo' ? `เวลา ${Math.ceil(remain)}    ป้อนแล้ว ${p.score}` : `${P_NAMES[p.idx]}   ${p.score}`;
  const w = ctx.measureText(txt).width + 36, x = mode==='solo' ? 16 : (p.idx===0 ? p.x0+16 : p.x1-16-w-8);
  sticker(x, 16, w, f*1.7, mode==='duo' ? P_COLORS[p.idx] : PAPER);
  ctx.fillStyle = mode==='duo' ? '#000' : '#fff'; ctx.fillText(txt, x+18, 16+f*0.85);
  if (p.combo >= 2){
    ctx.font = `800 ${f*0.8}px ${THAI}`;
    const ct = `คอมโบ x${p.combo}`, cw = ctx.measureText(ct).width + 24;
    const cx = mode==='solo' ? 16 : (p.idx===0 ? p.x0+16 : p.x1-16-cw-8);
    sticker(cx, 16+f*1.7+18, cw, f*1.2, '#ffcf33');
    ctx.fillStyle = '#000'; ctx.fillText(ct, cx+12, 16+f*1.7+18+f*0.6);
  }
}
function drawDuoMiddle(){
  const ctx = U;
  ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.setLineDash([14,12]);
  ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke(); ctx.setLineDash([]);
  const f = Math.max(16, Math.min(W,H)*0.035), remain = Math.max(0, GAME_TIME - playT);
  const w = f*3.2;
  sticker(W/2-w/2, 14, w, f*1.8, remain < 10 ? '#ff8e7a' : PAPER);
  label(`${Math.ceil(remain)}`, W/2, 14+f*0.9, f*0.9, remain < 10 ? '#fff' : '#ffcf33');
  label('VS', W/2, H*0.45, Math.min(W,H)*0.07, '#ffcf33');
}
function drawMsg(p, dt){
  const m = p.msg; if (!m) return;
  m.t -= dt; if (m.t <= 0){ p.msg = null; return; }
  const ctx = U, pw = p.x1-p.x0, solo = mode==='solo';
  const f = Math.max(18, Math.min(pw, H*1.6)*(solo?0.03:0.036));
  const two = solo && m.text;
  const w = Math.min(pw*0.88, 950), h = two ? f*3.3 : f*2, x = p.x0 + (pw-w)/2, y = solo ? H*0.13 : H*0.13;
  ctx.globalAlpha = Math.min(1, m.t*2);
  sticker(x, y, w, h, PAPER);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`800 ${f}px ${THAI}`; ctx.fillStyle = m.ok ? '#7be39a' : '#ff6b5e';
  ctx.fillText(m.title, x+w/2, y + (two ? f*1.05 : h/2), w-24);
  if (two){ ctx.font=`${f*0.85}px ${THAI}`; ctx.fillStyle='#fff'; ctx.fillText(m.text, x+w/2, y+f*2.3, w-24); }
  ctx.globalAlpha = 1;
}
function drawParticles(dt){
  for (const p of particles){
    if (p.slow){ p.vx += (Math.random()-0.5)*40*dt; p.vy = Math.min(p.vy + 40*dt, 260); } else p.vy += 900*dt;
    p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt*(p.slow?0.6:1.3);
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life)); ctx.fillStyle = p.c;
    const z = p.slow ? 12 : 12; ctx.fillRect(Math.round(p.x/4)*4, Math.round(p.y/4)*4, z, z);
  }
  ctx.globalAlpha = 1; particles = particles.filter(p => p.life > 0 && p.y < H+40);
}
function drawCountdown(dt){
  countdown -= dt;
  const n = Math.ceil(countdown);
  if (n !== lastBeep && n >= 1){ sfx.beep(); lastBeep = n; }
  if (countdown <= 0){
    sfx.go(); state = 'play'; playT = 0; players.forEach(nextItem); banner = {text:'ไป!', t:0.8};
    return;
  }
  const frac = countdown - Math.floor(countdown);
  label(String(n), W/2, H*0.36, Math.min(W,H)*(0.2 + 0.07*frac), '#ffcf33');
  label(mode==='duo' ? 'ยืนคนละฝั่ง แล้วยกมือขึ้น!' : 'มอนสเตอร์หิวแล้ว ยกมือขึ้นเลย!', W/2, H*0.55, Math.min(W,H)*0.05);
}
function drawBanner(dt){
  if (!banner) return;
  if (banner.p){ const p = banner.p, s = 1 + Math.sin(performance.now()/180)*0.06;
    label('ชนะ!', (p.x0+p.x1)/2, H*0.36, Math.min(W,H)*0.16*s, P_COLORS[p.idx]); return; }
  banner.t -= dt; if (banner.t <= 0){ banner = null; return; }
  label(banner.text, W/2, H*0.38, Math.min(W,H)*0.22*(1+(0.8-banner.t)*0.4), '#7be39a');
}

function loop(t){
  const dt = Math.min(0.05, (t-lastT)/1000 || 0); lastT = t;
  trackHands(); U.clearRect(0,0,W,H); drawBG(t);
  if (state !== 'menu' && players.length){
    if (state === 'play'){
      playT += dt;
      players.forEach(p => updatePlayer(p, dt));
      if (playT >= GAME_TIME){ players.forEach(p => p.held = false); endGame(); }
    }
    if (mode === 'duo') drawDuoMiddle();
    players.forEach(p => p.mons.forEach(m => drawMonster(m, p, t)));
    players.forEach(drawMonsterLabels);
    if (state === 'play'){ players.forEach(drawItem); players.forEach(drawItemLabel); }
    players.forEach(drawHUD);
    players.forEach(p => drawMsg(p, dt));
    if (state === 'countdown') drawCountdown(dt);
    drawBanner(dt);
  }
  drawParticles(dt);
  players.forEach(drawHand);
  requestAnimationFrame(loop);
}
function pixelTitle(el, text, color='#ffcf33'){
  const sz = 22, c = document.createElement('canvas'), x = c.getContext('2d');
  x.font = `800 ${sz}px ${THAI}`;
  c.width = Math.ceil(x.measureText(text).width) + 12; c.height = sz*1.7;
  x.font = `800 ${sz}px ${THAI}`; x.textBaseline = 'middle'; x.lineJoin = 'miter';
  x.lineWidth = 6; x.strokeStyle = '#000'; x.strokeText(text, 6, c.height/2+2);
  x.fillStyle = color; x.fillText(text, 6, c.height/2+2);
  const scale = Math.min(3, (Math.min(innerWidth*0.82, 820)) / c.width);
  c.style.width = c.width*scale + 'px'; c.style.height = c.height*scale + 'px';
  el.innerHTML = ''; el.appendChild(c);
}
window.__p = () => players;
document.fonts.ready.then(()=> pixelTitle(document.querySelector('#start h1'), 'มอนสเตอร์หิวขยะ!', '#7be39a'));
resize(); initHands(); requestAnimationFrame(loop);
</script>
